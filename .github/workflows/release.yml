name: Release HRNote

# Triggers on every pushed tag matching v* (e.g. v1.1.0, v1.2.0)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows-latest
            args: ""

          # macOS universal binary (Apple Silicon + Intel)
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"

    runs-on: ${{ matrix.platform }}

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Rust toolchain (macOS needs both targets for universal binary)
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 3. Rust dependency cache
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 4. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      # 5. Install JS dependencies
      - name: Install frontend dependencies
        run: npm ci

      # 6. Build and publish to GitHub Release
      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HRNote ${{ github.ref_name }}"
          releaseBody: |
            See the commits since the previous release for what changed in this version.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
