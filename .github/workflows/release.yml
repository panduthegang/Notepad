name: Release HRNote

# Triggers on every pushed tag matching v* (e.g. v1.1.0, v1.2.0)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Rust toolchain
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 3. Rust dependency cache
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 4. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      # 5. Install JS dependencies
      - name: Install frontend dependencies
        run: npm ci

      # 6. Build and publish Windows installer to GitHub Release
      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HRNote ${{ github.ref_name }}"
          releaseBody: |
            See the commits since the previous release for what changed in this version.
          releaseDraft: false
          prerelease: false
