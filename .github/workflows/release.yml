name: Release HRNote

# Triggers on every pushed tag matching v* (e.g. v0.1.0, v1.1.0, v2.0.0-beta)
on:
  push:
    tags:
      - "v*"
  # Allow manual trigger from the Actions tab for testing
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write   # required to create/edit GitHub Releases

    strategy:
      fail-fast: false   # keep building other platforms even if one fails
      matrix:
        include:
          # Windows
          - platform: windows-latest
            args: ""

          # macOS universal binary (Apple Silicon + Intel)
          - platform: macos-latest
            args: "--target universal-apple-darwin"

          # Linux
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Linux system dependencies (Tauri v2 requirements)
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf

      # 3. Rust toolchain
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 4. Rust dependency cache
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 5. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      # 6. Install JS dependencies
      - name: Install frontend dependencies
        run: npm ci

      # 7. Build and publish to GitHub Release
      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HRNote ${{ github.ref_name }}"
          releaseBody: |
            See the commits since the previous release for what changed in this version.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
